<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Portal Pré-Vendas NDD</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a}header{background:#0a1727;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:19px;margin:0}.actions{display:flex;gap:8px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.light{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}main{max-width:1250px;margin:26px auto;padding:0 20px}.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 20px rgba(15,23,42,.07);margin-bottom:20px}h2{font-size:18px;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.form input,.form select{height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0;white-space:nowrap}th{color:#475569;background:#f8fafc}.badge{padding:4px 7px;border-radius:999px;background:#e2e8f0}.history{font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:420px;overflow:auto;background:#0f172a;color:#e2e8f0;padding:15px;border-radius:10px}.msg{font-size:13px;margin-top:10px;color:#475569}@media(max-width:900px){.form{grid-template-columns:1fr 1fr}}@media(max-width:550px){.form{grid-template-columns:1fr}}</style></head><body>
<header><h1>Administração · Portal Pré-Vendas NDD</h1><div class="actions"><button class="light" onclick="location.href=NDD_PORTAL_CONFIG.portalPage">Portal</button><button class="danger" onclick="NDDAuth.logout()">Sair</button></div></header>
<main><section class="panel"><h2>Novo usuário</h2><form id="createForm" class="form"><input id="username" placeholder="Usuário" required><input id="displayName" placeholder="Nome completo" required><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha inicial" required><select id="role"><option value="USER">Usuário</option><option value="ADMIN">Administrador</option></select><button class="primary" type="submit">Criar usuário</button></form><div id="msg" class="msg"></div></section>
<section class="panel"><h2>Usuários</h2><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Último login</th><th>Ações</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="panel"><h2 id="historyTitle">Histórico</h2><div id="history" class="history">Selecione “Histórico” em um usuário.</div></section></main>
<script src="auth/config.js"></script><script src="auth/auth.js"></script><script>
let currentUser=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadUsers(){const data=await NDDAuth.request('/admin/users');document.getElementById('users').innerHTML=data.users.map(u=>`<tr><td>${esc(u.display_name)}</td><td>${esc(u.username)}</td><td><span class="badge">${esc(u.role)}</span></td><td>${u.is_active?'Ativo':'Inativo'}</td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString('pt-BR'):'-'}</td><td><button class="light" onclick="historyOf(${u.id},'${esc(u.display_name)}')">Histórico</button> <button class="${u.is_active?'danger':'primary'}" onclick="toggleUser(${u.id},${u.is_active?0:1})">${u.is_active?'Desativar':'Ativar'}</button></td></tr>`).join('');}
async function toggleUser(id,value){if(currentUser&&Number(currentUser.id)===Number(id)&&!value){alert('Você não pode desativar seu próprio usuário nesta tela.');return;}await NDDAuth.request('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({isActive:Boolean(value)})});await loadUsers();}
async function historyOf(id,name){document.getElementById('historyTitle').textContent='Histórico · '+name;const data=await NDDAuth.request('/admin/users/'+id+'/history');document.getElementById('history').textContent=JSON.stringify(data,null,2);}
document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Criando...';try{await NDDAuth.request('/admin/users',{method:'POST',body:JSON.stringify({username:username.value.trim(),displayName:displayName.value.trim(),email:email.value.trim()||null,password:password.value,role:role.value})});e.target.reset();msg.textContent='Usuário criado com sucesso.';await loadUsers();}catch(ex){msg.textContent=ex.status===409?'Esse usuário já existe.':'Erro ao criar usuário.';}});
(async()=>{currentUser=await NDDAuth.requireAuth('ADMIN');if(currentUser)await loadUsers();})();
</script></body></html>
